# PC に Docker Desktop が無くても、GitHub の Linux ランナー上でビルド・プッシュできます。
# 使い方: リポジトリの Settings → Secrets and variables → Actions でシークレットを設定し、
# Actions タブから「Push container image to Lightsail」を手動実行（workflow_dispatch）。

name: Push container image to Lightsail

on:
  workflow_dispatch:

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build image
        run: docker build -t invoice-salon:latest .

      - name: Push to Lightsail container registry
        run: |
          aws lightsail push-container-image \
            --service-name "${{ secrets.LIGHTSAIL_SERVICE_NAME }}" \
            --label invoice-salon \
            --image invoice-salon:latest
