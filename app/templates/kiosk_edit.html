{% extends "base.html" %}
{% set title = "修正 / Edit" %}
{% block content %}
  <div class="kiosk">
    <div class="kiosk__head">
      <h1 class="kiosk__title">修正 / แก้ไข</h1>
      <div class="kiosk__subtitle muted">今日のみ / เฉพาะวันนี้</div>
    </div>

    <section class="card kiosk__card">
      <div class="kiosk__fixedDate mono">{{ service_date }}　ID: {{ treatment.id }}</div>
    </section>

    <section class="card kiosk__card">
      <h2>修正内容</h2>
      <form class="kioskForm" method="post" action="{{ url_for('kiosk_edit_post', treatment_id=treatment.id) }}">
        <input type="hidden" name="return_date" value="{{ return_date }}" />
        <div class="kioskRow">
          <div class="kioskLabel">セラピスト / พนักงาน</div>
          <select class="kioskSelect" name="therapist_id" required>
            {% for t in therapists %}
              <option value="{{ t.id }}" {% if t.id == treatment.therapist_id %}selected{% endif %}>{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="kioskRow">
          <div class="kioskLabel">メニュー / เมนู</div>
          <select class="kioskSelect" name="menu_id" required>
            {% for m in menus %}
              <option value="{{ m.id }}" {% if m.id == treatment.menu_id %}selected{% endif %}>{{ m.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="kioskInlineFields">
          <div class="kioskInlineField">
            <label class="kioskLabel" for="hpb">HPB（割引）/ ส่วนลด</label>
            <input id="hpb" name="hpb" class="kioskInput" type="number" inputmode="numeric" min="0" value="{{ treatment.hpb if treatment.hpb is not none else 0 }}" />
          </div>
          <div class="kioskInlineField">
            <label class="kioskLabel" for="p">P（ポイント）/ แต้ม</label>
            <input id="p" name="p" class="kioskInput" type="number" inputmode="numeric" min="0" value="{{ treatment.p if treatment.p is not none else 0 }}" />
          </div>
          <div class="kioskInlineField">
            <label class="kioskLabel" for="r">R（指名料）/ ค่าตัว</label>
            {% set rv = treatment.r if treatment.r is not none else 0 %}
            <select id="r" name="r" class="kioskSelect kioskSelect--small" required>
              <option value="0" {% if rv == 0 %}selected{% endif %}>なし / ไม่มี</option>
              <option value="500" {% if rv == 500 %}selected{% endif %}>500</option>
              <option value="1000" {% if rv == 1000 %}selected{% endif %}>1000</option>
            </select>
          </div>
        </div>

        <div class="actions kiosk__actions">
          <button class="btn kiosk__btn kiosk__btn--primary" type="submit">保存 / บันทึก</button>
          <a class="btn btn--secondary kiosk__btn" href="{{ url_for('kiosk', date=return_date, _anchor='history') }}">戻る / กลับ</a>
        </div>
      </form>
    </section>
  </div>
{% endblock %}
