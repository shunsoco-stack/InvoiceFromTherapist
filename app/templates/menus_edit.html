{% extends "base.html" %}
{% set title = "メニュー編集" %}
{% block content %}
  <div class="page-head">
    <h1>メニュー編集</h1>
    <p class="muted">メニュー名（例：T/60）や単価、歩合を修正できます。</p>
  </div>

  <section class="card">
    <form class="form" method="post" action="{{ url_for('menus_edit_post', menu_id=menu.id) }}">
      <div class="form-row">
        <label>メニュー名</label>
        <input name="name" value="{{ menu.name }}" required />
      </div>
      <div class="form-row">
        <label>単価（円）</label>
        <input name="price" type="number" inputmode="numeric" min="0" value="{{ menu.price }}" />
      </div>
      <div class="form-row">
        <label>メニュー別歩合（任意）</label>
        <div class="inline">
          <select name="commission_type">
            <option value="" {% if not menu.commission_type %}selected{% endif %}>（セラピスト設定を使う）</option>
            <option value="percent" {% if menu.commission_type == "percent" %}selected{% endif %}>％</option>
            <option value="fixed" {% if menu.commission_type == "fixed" %}selected{% endif %}>固定（円/件）</option>
          </select>
          <input name="commission_value" type="number" inputmode="numeric" placeholder="例）55 または 3000" value="{{ menu.commission_value if menu.commission_value is not none else '' }}" />
        </div>
      </div>
      <div class="form-row">
        <label>有効</label>
        <label class="checkbox"><input type="checkbox" name="is_active" {% if menu.is_active %}checked{% endif %} /> 入力に出す</label>
      </div>

      <div class="actions">
        <button class="btn" type="submit">保存</button>
        <a class="btn btn--secondary" href="{{ url_for('menus_list') }}">戻る</a>
      </div>
    </form>
  </section>
{% endblock %}
