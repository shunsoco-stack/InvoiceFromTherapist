{% extends "base.html" %}
{% set title = "トップ" %}
{% block content %}
  <div class="homeSimple">
    {% if logo_url %}
      <div class="homeSimple__logoWrap">
        <img class="homeSimple__logo" src="{{ logo_url }}" alt="{{ logo_alt }}" />
      </div>
    {% endif %}
    <div class="homeSimple__title mono">{{ today }}</div>
    <div class="homeSimple__buttons">
      <a class="btn homeSimple__btn homeSimple__btn--primary" href="{{ url_for('kiosk') }}">入力 / บันทึก</a>
      <a class="btn btn--secondary homeSimple__btn homeSimple__btn--admin" href="{{ url_for('admin') }}">管理 / จัดการ</a>
      <a class="btn btn--secondary homeSimple__btn homeSimple__btn--supplies" href="{{ url_for('supplies_page') }}">
        <span class="homeSimple__btnLabel">備品 / ของใช้</span>
        {% if supply_alerts_count and supply_alerts_count > 0 %}
          <span class="homeSimple__btnBadge" aria-hidden="true">!</span>
        {% endif %}
      </a>
    </div>
  </div>
{% endblock %}
